name: Refresh profile assets

# One workflow, one job, one push. The previous split (readme-stats.yml +
# snake.yml) ran on identical triggers and both rewrote README.md and pushed,
# so concurrent runs raced on the same line and a push could be rejected.

on:
  schedule:
    - cron: "0 4 * * *" # midnight US East (EDT/EST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/profile-assets.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: pip install --quiet pillow numpy

      - name: Check for a browser to rasterise with
        run: |
          for bin in google-chrome chromium chromium-browser; do
            if command -v "$bin" >/dev/null; then
              echo "found $bin"; exit 0
            fi
          done
          echo "::error::no chrome/chromium on the runner"; exit 1

      - name: Rebuild the card SVGs
        run: python3 tools/generate_profile_cards.py

      - name: Refresh the GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The script falls back to profile/github-stats.json when the API
        # refuses a request, so a rate-limited run re-renders the last good
        # numbers instead of a card built from a half-finished fetch.
        run: python3 tools/generate_github_stats.py

      - name: Render the cards through the CRT pipeline
        run: python3 tools/render_cards.py

      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=%232563eb&color_dots=%23121212,%23333333,%23585858,%238b8b8b,%233b82f6

      - name: Verify every card rendered
        run: |
          missing=0
          for card in hero impact card-bonsai card-langalpha \
                      card-sunlightcity stack github; do
            png="profile/$card.png"
            if [ ! -s "$png" ] || [ "$(stat -c%s "$png")" -lt 10000 ]; then
              echo "::error::$png missing or suspiciously small"
              missing=1
            fi
          done
          exit $missing

      - name: Bump the README timestamp so GitHub re-fetches the cards
        run: |
          sed -i "s/profile cards updated: [0-9-]*/profile cards updated: $(date +%Y-%m-%d)/" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile assets README.md
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Refresh profile assets (US East Time)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
